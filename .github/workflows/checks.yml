name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Use committed data so the UI gate does not depend on upstream RSS uptime.
      - run: npm run build:static
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:empty

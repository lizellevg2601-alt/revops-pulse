name: Daily Feed Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run generate:feed

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: daily feed data update"
          file_pattern: public/feed-data.json
